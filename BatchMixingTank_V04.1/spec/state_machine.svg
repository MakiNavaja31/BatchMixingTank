<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8a96a3"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d6332a"/></marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="20" y="26" font-size="14" font-weight="500" fill="#172433">A batch runs Filling, Mixing, Emptying; alarms divert it to cleaning or Alarm Stop</text>
  <g font-size="13" fill="#172433" text-anchor="middle">
    <rect x="20" y="60" width="130" height="44" rx="8" fill="#fff" stroke="#8a96a3"/><text x="85" y="87">Stopped</text>
    <rect x="215" y="60" width="130" height="44" rx="8" fill="#fff" stroke="#8a96a3"/><text x="280" y="87">Filling_OP</text>
    <rect x="410" y="60" width="130" height="44" rx="8" fill="#fff" stroke="#8a96a3"/><text x="475" y="87">Mixing_OP</text>
    <rect x="605" y="60" width="130" height="44" rx="8" fill="#fff" stroke="#8a96a3"/><text x="670" y="87">Empty_OP</text>
    <rect x="215" y="180" width="130" height="44" rx="8" fill="#fff" stroke="#8a96a3"/><text x="280" y="207">Cleaning_OP</text>
    <rect x="605" y="180" width="130" height="44" rx="8" fill="#fff" stroke="#8a96a3"/><text x="670" y="207">Waiting</text>
    <rect x="410" y="290" width="130" height="44" rx="8" fill="#fde9e7" stroke="#d6332a" stroke-width="1.5"/><text x="475" y="317" font-weight="500">Alarm Stop</text>
  </g>
  <g fill="none" stroke="#8a96a3" stroke-width="1.3">
    <path d="M150 82 H213" marker-end="url(#a)"/>
    <path d="M345 82 H408" marker-end="url(#a)"/>
    <path d="M540 82 H603" marker-end="url(#a)"/>
    <path d="M670 104 V178" marker-end="url(#a)"/>
    <path d="M605 202 H347" marker-end="url(#a)"/>
    <path d="M265 104 V178" marker-end="url(#a)"/>
    <path d="M295 180 V106" marker-end="url(#a)"/>
    <path d="M215 202 H100 V106" marker-end="url(#a)"/>
    <path d="M410 312 H70 V106" marker-end="url(#a)"/>
  </g>
  <path d="M260 262 H690" stroke="#d6332a" stroke-dasharray="5 4" fill="none"/>
  <path d="M475 262 V288" stroke="#d6332a" fill="none" marker-end="url(#r)"/>
  <g font-size="11" fill="#5b6878">
    <text x="160" y="76">Start · T1</text>
    <text x="352" y="76">dosed · T6</text>
    <text x="545" y="76">mix time · T7</text>
    <text x="676" y="146">level 0 · T8</text>
    <text x="400" y="196">recipe change · T4, Normal Stop · T10</text>
    <text x="196" y="146" text-anchor="end">alarm 3 · T15</text>
    <text x="302" y="146">cleaned · T13</text>
    <text x="110" y="196">cleaned · T14</text>
    <text x="270" y="306">Reset · T17</text>
    <text x="270" y="256">alarm 1, 2 or 4 in any running state · T16</text>
    <text x="545" y="40">Waiting → Filling (T3) when the recipe is the same</text>
  </g>
